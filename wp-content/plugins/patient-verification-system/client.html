<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <div class="verification-container">
        <p class="ver-heading">Patient Verification System</p>
        <div class="ver-form">
            <form action="#">
                <input class="ver-code" type="number" placeholder="Please enter your verification number" required>
                <button class="ver-submit" type="submit">Verify</button>
            </form>
        </div>
        <div class="ver-output-error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#E40000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4.93018 4.92999L19.0702 19.07" stroke="#E40000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                
            <p class="ver-error">Oops! We couldn't find that record.</p>
        </div>


        <div class="ver-out-success">
            <div class="success-msg">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 11.08V12C21.9988 14.1564 21.3005 16.2547 20.0093 17.9818C18.7182 19.709 16.9033 20.9725 14.8354 21.5839C12.7674 22.1953 10.5573 22.1219 8.53447 21.3746C6.51168 20.6273 4.78465 19.2461 3.61096 17.4371C2.43727 15.628 1.87979 13.4881 2.02168 11.3363C2.16356 9.18455 2.99721 7.13631 4.39828 5.49706C5.79935 3.85781 7.69279 2.71537 9.79619 2.24013C11.8996 1.7649 14.1003 1.98232 16.07 2.85999" stroke="#22CD00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 4L12 14.01L9 11.01" stroke="#22CD00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <p class="success-alert">Patient verification data has matched.</p>
                    
            </div>
            <table class="ver-table">
                <tr class="ver-row1">
                    <th>Patient Name</th>
                    <th>Doctor Name</th>
                    <th>Verification Code</th>
                    <th>Expiry Date</th>
                </tr>
                <tr class="ver-row2">
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
            </table>
        </div>
    </div>
    
</body>
</html>
